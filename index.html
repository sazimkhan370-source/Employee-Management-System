<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        /* Modern Blue/Gray Theme & CSS Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        header h1 {
            color: #1a365d;
            font-size: 2rem;
        }

        /* Card Section Styling */
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            font-size: 1.25rem;
            color: #2b6cb0;
            margin-bottom: 15px;
        }

        /* Form Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #3182ce;
        }

        .btn-submit {
            grid-column: 1 / -1;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #2c5282;
        }

        /* Responsive Table Styling */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #ebf8ff;
            color: #2b6cb0;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: #f7fafc;
        }

        /* Action Buttons */
        .btn-delete {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background-color: #c53030;
        }

        .empty-state {
            text-align: center;
            color: #718096;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Employee Management System</h1>
        </header>

        <!-- Form Card: Add Employee -->
        <section class="card">
            <h2>Add New Employee</h2>
            <form id="employee-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary ($)</label>
                        <input type="number" id="salary" placeholder="50000" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-submit">Add Employee</button>
                </div>
            </form>
        </section>

        <!-- Table Card: Employee List -->
        <section class="card">
            <h2>Employee List</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Hire Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <!-- Dynamic Rows Injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Frontend JavaScript Logic -->
    <script>
        const API_URL = 'http://localhost:5000/api/employees';

        // DOM Elements
        const empForm = document.getElementById('employee-form');
        const empTableBody = document.getElementById('employee-table-body');

        // Fetch and display employees when DOM loads
        document.addEventListener('DOMContentLoaded', fetchEmployees);

        // 1. FETCH & RENDER EMPLOYEES
        async function fetchEmployees() {
            try {
                const response = await fetch(API_URL);
                const employees = await response.json();

                empTableBody.innerHTML = ''; // Clear table

                if (employees.length === 0) {
                    empTableBody.innerHTML = `<tr><td colspan="7" class="empty-state">No employees found.</td></tr>`;
                    return;
                }

                employees.forEach(emp => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${emp.id}</td>
                        <td>${escapeHtml(emp.name)}</td>
                        <td>${escapeHtml(emp.email)}</td>
                        <td>${escapeHtml(emp.department)}</td>
                        <td>$${parseFloat(emp.salary).toLocaleString()}</td>
                        <td>${emp.hire_date}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                        </td>
                    `;
                    empTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching employees:', error);
                empTableBody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:red;">Failed to connect to backend server.</td></tr>`;
            }
        }

        // 2. CREATE EMPLOYEE (POST Request)
        empForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newEmployee = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                department: document.getElementById('department').value,
                salary: parseFloat(document.getElementById('salary').value)
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEmployee)
                });

                if (response.ok) {
                    empForm.reset();
                    fetchEmployees(); // Refresh list
                } else {
                    alert('Failed to add employee. Email might already exist.');
                }
            } catch (error) {
                console.error('Error creating employee:', error);
            }
        });

        // 3. DELETE EMPLOYEE (DELETE Request)
        async function deleteEmployee(id) {
            if (!confirm(`Are you sure you want to delete employee ID #${id}?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchEmployees(); // Refresh list
                } else {
                    alert('Failed to delete employee.');
                }
            } catch (error) {
                console.error('Error deleting employee:', error);
            }
        }

        // Helper utility to sanitize output text
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
